services:
  postgres:
    image: postgres:17-alpine
    container_name: raddina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: raddina
      POSTGRES_PASSWORD: raddina_secret_password
      POSTGRES_DB: raddina_health_db
    ports:
      - "5432:5432"
    volumes:
      - raddina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raddina -d raddina_health_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: raddina-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  raddina_pgdata:
